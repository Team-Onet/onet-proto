syntax = "proto3";

package onet.spec.v1;

option csharp_namespace = "Onet.Spec.V1";
option java_multiple_files = true;
option java_outer_classname = "ClientSpecProto";
option java_package = "com.onet.spec.v1";

// 클라 · 서버 공용 스펙 묶음 (client.pb, CDN 공개). 클라 표시 · 사전 검증에 필요한 값만.
// 원본 = backend spec/source/*.json (proto JSON), 버전 단위 배포 (docs/spec-data-architecture.md)
message ClientSpec {
  repeated MapSpec maps = 1;
  repeated ItemSpec items = 2;
  int32 max_loadout = 3;                       // 한 판에 가져갈 아이템 최대 종 수 (중복 X)
  repeated SpecialBlockSpec special_blocks = 4; // 블록 능력별 수치 (특수블록 · 보너스 상자 보상 공용)
  NicknameRule nickname = 5;
  string version = 6;  // 묶음 버전 (번들러가 채움, 원본 json 에 쓰지 않음). 비교 = 같음 / 다름만 (대소 X)
}

// 맵 1건 = 블록 배치 + 보드 구성 튜닝 (그림 종류 · 그림당 쌍 · 칸 점수)
message MapSpec {
  int32 id = 1;
  int32 map_type = 2;           // 사이즈 그룹 (매칭 요청 map_type) = rows 긴 변 (번들러가 채움, 원본 json 에 쓰지 않음)
  string map_label = 3;         // snake_case 운영 식별자
  repeated string rows = 4;     // 위 → 아래 행. '1' = 블록 칸, '0' = 빈 칸. 행 수 = 높이, 글자 수 = 너비
  int32 max_art_types = 5;      // 한 판에 쓰는 그림 종류 상한 (블록 칸 / 2 와 작은 쪽)
  int32 max_pairs_per_art = 6;  // 그림 1종당 최대 쌍 수
  SlotScore slot_score = 7;
  bool deprecated = 8;          // 매칭 요청 · 랜덤 선택 제외 (id 는 삭제하지 않음). 클라 = 맵 목록에서 숨김
}

// 매칭 경로가 지나는 칸의 점수 (경로 선택 · 획득 점수)
message SlotScore {
  int32 neutral = 1;  // 아무도 점령 안 한 칸
  int32 own = 2;      // 우리 팀 칸
  int32 enemy = 3;    // 상대 팀 칸 (재점령)
}

// 아이템 1건. 능력 = oneof case (수치 포함). 같은 능력의 수치 변형은 id 로 구분
message ItemSpec {
  int32 id = 1;
  string item_label = 2;  // snake_case 운영 식별자 = 클라 리소스 키 (아이콘 · 이름 · 설명 i18n). 한 번 정하면 변경 X
  bool deprecated = 3;    // 신규 판매 중지 (id 는 삭제하지 않음, 보유분은 계속 사용 · 표시). 클라 = 상점에서 숨김
  oneof ability {
    TrapItem trap = 10;
    ShuffleItem shuffle = 11;
    SnakeItem snake = 12;
    EraserItem eraser = 13;
    HookItem hook = 14;
    HintItem hint = 15;
    InkItem ink = 16;
  }
}

message TrapItem {}
message ShuffleItem {}
message SnakeItem {}
message EraserItem {}

message HookItem {
  int32 steal_count = 1;  // 강탈 칸 수 (= 사용 가능 최소 상대 점령 칸 수)
}

message HintItem {
  int32 turns = 1;  // 안내 턴 수 (본인 턴 기준, 사용한 턴 포함)
}

message InkItem {
  int32 size = 1;   // 영역 한 변 칸 수 (보드에 안 들어가면 축소)
  int32 count = 2;  // 영역 수
  int32 turns = 3;  // 유지 턴 수 (상대 턴 기준, 사용한 턴 미포함)
}

// 블록 능력 1건. 능력 = oneof case
message SpecialBlockSpec {
  bool hidden = 1;  // 특수블록으로 놓였을 때 능력 종류를 클라에 숨김
  oneof ability {
    BonusBlock bonus = 10;
    ShuffleBlock shuffle = 11;
    FortifyBlock fortify = 12;
    ThiefBlock thief = 13;
    BombBlock bomb = 14;
  }
}

message BonusBlock {
  int32 score = 1;  // 보너스 점수
}

message ShuffleBlock {}
message FortifyBlock {}

message ThiefBlock {
  int32 min_steal = 1;  // 강탈 칸 수 하한 (min~max 랜덤)
  int32 max_steal = 2;
}

message BombBlock {
  int32 min_pairs = 1;  // 추가 제거 쌍 수 하한 (min~max 랜덤)
  int32 max_pairs = 2;
}

// 닉네임 규칙. 허용 문자 (한글 완성형 · 영문 · 숫자) · 폭 계산 (한글 2 · 그 외 1) 은 코드 고정
message NicknameRule {
  int32 min_width = 1;
  int32 max_width = 2;
  int32 change_cooldown_days = 3;  // 사용자 변경 간격 (첫 설정 포함)
  int32 released_lock_days = 4;    // 다른 플레이어가 반환한 닉네임 잠금 기간
}
