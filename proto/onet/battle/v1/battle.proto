syntax = "proto3";

package onet.battle.v1;

option csharp_namespace = "Onet.Battle.V1";
option java_multiple_files = true;
option java_outer_classname = "BattleProto";
option java_package = "com.onet.battle.v1";

import "onet/battle/v1/battle_cheat.proto";
import "onet/battle/v1/battle_types.proto";
import "onet/common/v1/common_types.proto";
import "onet/common/v1/error_code.proto";

// ============================================================
// 도메인 페이로드 (envelope 와 service 는 battle_base.proto)
// ============================================================

// 룸 입장. battle_token 은 MatchMaker 가 발급한 JWT.
// 페이로드: roomId, playerId, nickname, level, mode, mapId, mapType, itemIds
message JoinRoomRequest {
  string battle_token = 1;
  CheatOptions cheat = 2;   // 테스트용 치트 (LOCAL / DEV 서버만 적용). 미지정 = 치트 없음
}

// 블록 좌표 선택.
// 첫 번째 호출 → 블록 선택, 두 번째 호출 → 매칭 시도.
// 이미 선택한 블록과 같은 좌표 전송 시 → 선택 해제.
message SelectBlockRequest {
  int32 pos_x = 1;
  int32 pos_y = 2;
}

// 아이템 사용 (대상 지정까지 한 번에 요청). 자기 턴 + 연출 입력 잠금 아닐 때만. 아이템별 판당 1회, 턴당 1개.
// 사용해도 턴 유지 → 남은 턴 시간 동안 매칭 가능 (매칭 시 턴 종료). 단 매칭형 아이템 (SNAKE) = 이어지는 BlockMatched 로 턴 종료.
// 턴이 끝난 뒤 도착한 요청은 거절 (= 사용 취소, 소모 X).
// 성공 = ItemUsed (방 전원). 거절 = StreamError (NOT_YOUR_TURN / ITEM_UNAVAILABLE / INVALID_BLOCK_POS), 상태 변경 없음.
message UseItemRequest {
  int32 item_id = 1;              // 카탈로그 아이템 id. 보유 / 사용 여부 = PlayerInfo.items
  repeated BlockPos targets = 2;  // 터치한 블록 칸. 개수 = 아이템 사용 방식 (ItemActivation: SINGLE 1 / PAIR 2 / AUTO_ACTIVE 0)
}

// 보드 전체 상태 동기화 요청.
// 앱 백그라운드 복귀, 재접속 등 상태 불일치 의심 시 사용.
message BoardSyncRequest {}

// 포기 선언. 즉시 패배 처리 후 GameResult 전송.
message GiveUpRequest {}

// 클라이언트 매칭/입장 연출 완료 신호.
// RoomJoined 수신 후 각 클라가 준비되면 송신.
// 서버는 모든 세션(봇 포함)이 ready 상태일 때 GameStarted 를 브로드캐스트한다.
message StartGameReadyRequest {}


// 룸 입장 완료. 초기 보드 상태 포함.
// 모든 플레이어가 받으며, 이후 GameStarted 를 기다린다.
message RoomJoined {
  string room_id = 1;
  repeated PlayerInfo players = 2;
  BoardState board_state = 3;
  onet.common.v1.MatchMode mode = 4;
  string my_player_id = 5;  // 수신자 본인의 playerId
}

// 모든 플레이어 입장 완료 → 게임 시작.
// 이 메시지 이후 첫 번째 NextTurn 이 전송된다.
message GameStarted {
  int64 started_at_ms = 1;                                     // 서버 기준 게임 시작 타임스탬프
  repeated onet.common.v1.AbilityType special_blocks = 2;      // 이번 판 배치된 특수블록 능력 (종류당 1개, 숨김 포함 - 유저 긴장 UX). 위치 = BlockData.ability_type (숨김은 0)
}

// 다음 턴 시작. 모든 플레이어에게 브로드캐스트.
// turn_end_at_unix_ms: 이번 턴 종료 절대시각 (서버 unix ms). 클라는
// server_time_ms 와 비교해 drift 보정 후 (deadline - now) 로 잔여시간 계산.
// tempo_deadline_unix_ms: 이번 턴 템포 판정 마감 절대시각. 마감 전 첫 매칭 = 달성 (BlockMatched.tempo_hit).
//   - 0 이면 미적용 (봇 턴 등). 그 외에는 항상 turn_end_at_unix_ms 이하.
// 재접속 스냅샷 NextTurn 이 턴 전환 중에 오면 turn_end_at_unix_ms / turn_time_ms = 0 (BoardSyncResponse 와 동일, 곧 실제 NextTurn 수신).
message NextTurn {
  string player_id = 1;
  int32 turn_time_ms = 2;       // 이번 턴 총 제한시간 (ms)
  int32 turn_number = 3;        // 전체 턴 카운터 (1부터 시작)
  bool is_prev_timeout = 4;     // 이전 턴이 타임아웃으로 종료된 경우 true
  int64 turn_end_at_unix_ms = 5; // 이번 턴 종료 절대시각 (서버 unix ms)
  int64 tempo_deadline_unix_ms = 6; // 템포 판정 마감 절대시각. 0 = 미적용.
  repeated Effect effects = 7;  // 이 이벤트에서 재생할 연출 시퀀스 (턴 규칙 능력 개시 JOKER_ACTIVATED 등, trigger = 발동원)
  repeated onet.common.v1.AbilityType turn_abilities = 8;  // 이번 턴 활성 턴 규칙 능력 (JOKER). 일반 턴 = 빈 리스트
}

// 블록 선택/해제 브로드캐스트.
// is_deselected = true 이면 선택이 해제된 것.
message BlockSelected {
  string player_id = 1;
  BlockPos pos = 2;
  bool is_deselected = 3;
}

// 매칭 성공 브로드캐스트.
// 서버는 effects[] delay 합계만큼 대기 후 다음 메시지 송출: GameResult (블록 0) / ConveyorShifted · BoardShuffled · NextTurn (턴 전환).
// 블록 제거 대상 = path 첫 칸 · 마지막 칸 + joker_removed_blocks + abilities[].bomb.slots. remaining_block_count 는 이 전부 반영된 값.
// effects 재생 중 SelectBlock 은 StreamError(NOT_YOUR_TURN) 로 거부됨 → 다음 NextTurn 까지 입력 잠금 권장.
// 발동 능력 = abilities (순서 = start 블록 → end 블록 → 경로 순 상자 보상). 두 블록 모두 특수블록이면 둘 다 발동.
// 셔플 능력은 결과 (shuffle) 만 → 재배치는 연출 종료 후 BoardShuffled(reason=ABILITY).
// 소유: player_id = 매칭한 플레이어 (입력 주체), owner_team_id = 결과 소유 팀 (점령 · 능력 · 상자 보상).
// 설치 함정 (아이템) 매칭이면 소유 = 매칭한 팀의 상대 팀. 뒤집기는 매칭당 최대 1회 (함정 여러 개 동시 = 1회).
message BlockMatched {
  string player_id = 1;                             // 매칭한 플레이어 (입력 주체). 템포 · 매칭 스탯 · 선택 연출 기준
  repeated BlockPos path = 2;                       // 경로상 모든 좌표. [0] = 시작 블록 칸, [last] = 끝 블록 칸. SNAKE 아이템 = 꺾기 무제한 경로
  repeated OccupiedSlot occupied = 3;               // 매칭 경로로 점유된 슬롯 (시작 · 끝 칸 포함, 소유 = owner_team_id). 능력 추가 점령분은 abilities 쪽
  int32 match_score = 4;                            // 경로 점수 (미점유 1 / 상대 점령 2 / 자기 점령 0 합산). 연출 참고용, 최종 점수와 무관
  int32 remaining_block_count = 5;                  // 매칭 후 남은 블록 수 (조커 보정 / 폭탄 추가 제거 반영)
  bool is_auto_match = 6;                           // true = 서버 자동 매칭 (턴 timeout 트리거). false = 사용자 매칭
  repeated Effect effects = 7;                     // 연출 시퀀스. 순서 = BLOCK_MATCHED → JOKER_MATCHED → 설치 함정 TRAP_SPRUNG* (trigger ITEM, 함정 칸마다) → 능력 연출 (abilities 순서, 셔플 · 대상 없는 폭탄 = 없음. 상자는 BONUS_BOX_BROKEN 먼저) → FEVER. 능력 연출 ↔ 결과 = Effect.trigger == AbilityResult.trigger
  repeated BlockPos joker_removed_blocks = 8;      // 조커 교차 매칭 (시작 · 끝 블록 art_num 상이) 시 짝 보정으로 추가 제거된 블록 (0 or 2개, 점령 X)
  bool tempo_hit = 9;                              // 템포 판정 마감 (NextTurn.tempo_deadline_unix_ms) 전 첫 매칭. 자동 매칭 / 봇 = false
  repeated BoardObjectPassed board_object_passes = 10;  // 매칭 경로가 지나간 보드 오브젝트 (경로 순서, 미파괴 타격 포함). 파괴된 오브젝트는 보드에서 제거. 파괴 보상 = abilities (trigger BONUS_BOX, pos = 오브젝트 pos)
  repeated AbilityResult abilities = 11;            // 발동 능력 결과 (특수블록 · 상자 보상). 순서 = start 블록 → end 블록 → 경로 순 상자
  string owner_team_id = 12;                        // 결과 소유 팀 = occupied · thief · bomb 칸 소유 + 보너스 · 상자 보상 수령. 설치 함정 매칭이면 상대 팀 (항상 세팅)
}

// 매칭 경로가 지나간 보드 오브젝트 1개. 종류 = oneof case.
message BoardObjectPassed {
  BlockPos pos = 1;
  oneof result {
    // 보너스 상자 타격 후 남은 HP (total / type 은 스냅샷 BonusBoxState). 0 = 파괴 → effects BONUS_BOX_BROKEN + 보상 = abilities (trigger BONUS_BOX, 같은 pos)
    int32 bonus_box_remain = 2;
  }
}

// 능력 1회 발동 결과. 발동원 (특수블록 · 보너스 상자 · 아이템) 무관 공용. 능력 종류 = oneof case. 연출 타이밍 = 같은 메시지 effects
message AbilityResult {
  EffectTrigger trigger = 1;    // 발동원. 같은 메시지 effects[].trigger 와 같은 값 = 연출 ↔ 결과 매칭 키
  oneof result {
    int32 bonus = 2;            // 보너스 점수 (소유 팀 획득). 연출 BONUS
    ShuffleResult shuffle = 3;  // 셔플. 연출 없음 → 매칭 연출 종료 후 BoardShuffled(reason=ABILITY)
    FortifyResult fortify = 4;  // 성벽. 연출 FORTIFY
    ThiefResult thief = 5;      // 도둑. 연출 THIEF
    BombResult bomb = 6;        // 폭탄. 연출 BOMB (slots 비면 없음)
    BlockPos trap = 7;          // 함정 설치 칸 (ItemUsed, 사용자 팀만). 연출 TRAP_SET. 함정은 블록과 함께 이동 (셔플 / 벨트), 매칭되면 발동 (BlockMatched TRAP_SPRUNG)
  }
}

// 셔플 능력 발동. 재배치 = 매칭 연출 종료 후 BoardShuffled (한 매칭에 셔플 결과 여러 개여도 1회)
message ShuffleResult {
}

// 성벽 능력 발동. BlockMatched.occupied 슬롯이 fortified 가 됨 → 이후 상대 매칭 경로 / 도둑 강탈로 소유권 이전 안 됨.
// 재접속 / 동기화 시 상태는 SlotData.fortified 로 복원.
message FortifyResult {
}

// 도둑 능력 발동. 랜덤 N (서버 스펙 min~max값) 슬롯을 소유 팀 (BlockMatched.owner_team_id) 으로 변경. 위치 무관 (경로와 별개).
// - 상대 점령 슬롯 K >= N → 랜덤 N 개 강탈 / 0 < K < N → K 개 전부
// - 상대 점령 0 → 블록 없는 미점령 슬롯 N 개 점령 (부족하면 있는 만큼)
// - fortified 슬롯 제외
message ThiefResult {
  repeated BlockPos slots = 1;  // 소유가 바뀐 슬롯
  bool is_retaken = 2;          // 상대 점령 강탈 = true, 미점령 점령 = false (발동 1회 안에서 공통)
}

// 폭탄 능력 발동. 일반 매칭 점령에 더해 랜덤 N (서버 스펙 min~max값) 블록 쌍을 경로 무관하게 추가 제거 + 그 칸 점령 (소유 팀).
// - 대상 = 같은 art_num 2개 쌍. 일반 블록 쌍 우선, 부족 시 특수블록 포함 쌍 (제거된 특수블록 능력은 미발동)
// - 남은 쌍 < N 이면 남은 쌍만. 0 이면 slots 빈 리스트 + effects 에 BOMB 없음
// 서버 상태는 수신 시점에 이미 확정. 클라는 EFFECT_TYPE_BOMB 구간 동안 제거/점령 표시를 늦춰도 되나,
// 그 전에 BoardShuffled / NextTurn 이 오면 즉시 반영 후 처리.
message BombResult {
  repeated BlockPos slots = 1;  // 제거 블록 = 점령 슬롯 (블록 칸은 항상 미점령 → 역전 없음). [0],[1] = 1번째 쌍, [2],[3] = 2번째 쌍 … (쌍별 연출용)
}

// 매칭 실패 브로드캐스트 (경로 없음 or 타입 불일치).
// 클라이언트는 선택을 초기화하고 재시도 허용.
message BlockMatchFailed {
  string player_id = 1;
  BlockPos start_pos = 2;
  BlockPos end_pos = 3;
}

// 턴 타임아웃. 이후 서버가 NextTurn 을 전송한다.
message TurnTimeout {
  string player_id = 1;
}

// 보드 셔플 완료 브로드캐스트. 셔플 도메인 전용.
// 자동 셔플 / 셔플 능력 (특수블록 · 아이템 등 발동원 무관) 통합 - reason 으로 원인 구분.
message BoardShuffled {
  repeated BlockMove moves = 1;
  ShuffleReason reason = 2;
  repeated Effect effects = 3;  // 이 이벤트에서 재생할 연출 시퀀스 (BOARD_SHUFFLED)
}

// 컨베이어 벨트 1칸 회전 브로드캐스트. 턴 전환마다 1회 (BlockMatched / TurnTimeout 연출 뒤, BoardShuffled · NextTurn 앞).
// moves 대로 칸 내용물 이동: 칸 내용물 = 블록 + 점령 (팀 / fortified) + 보드 오브젝트. 벨트 전 칸 (빈 칸 포함) from → to.
// BoardState.conveyor_cells 는 벨트 / 포털 표시용. 이동 계산은 moves 만 사용.
message ConveyorShifted {
  repeated BlockMove moves = 1;  // 벨트 칸 이동 (from → to). BoardShuffled.moves 와 달리 점령 상태 + 보드 오브젝트도 함께 이동
  repeated Effect effects = 2;   // 이 이벤트에서 재생할 연출 시퀀스 (CONVEYOR_SHIFTED)
}

// 보드 전체 상태 동기화 응답.
// turn_end_at_unix_ms: 현재 턴 종료 절대시각 (서버 unix ms).
// 클라는 매 프레임 (deadline - now + drift) 로 잔여시간 계산.
//   - 0 = 턴 전환 중 (매칭 · 타임아웃 연출 ~ 다음 NextTurn). 카운트다운 정지 후 NextTurn 에서 갱신.
//   - 턴 유지 연출 (아이템 사용 · 턴 규칙 능력 개시) 중에는 현재 턴 마감 그대로.
message BoardSyncResponse {
  BoardState board_state = 1;
  string current_player_id = 2;     // 현재 턴 플레이어
  int64 turn_end_at_unix_ms = 3;    // 현재 턴 종료 절대시각 (서버 unix ms)
}

// 아이템 사용 결과. 방 전원 수신 (받는 팀별로 내용 다름). 아이템 능력 = item_id → 아이템 스펙 ability.
// 결과 (ability) = 이 메시지가 운반하는 능력 결과. 숨김 결과 (함정 위치) 는 사용자 팀에게만, 상대 팀 수신분은 unset.
// 다른 메시지가 결과를 운반하는 아이템 = unset: 셔플 → [BlockSelected 해제] → BoardShuffled(ABILITY), SNAKE → [BlockSelected 해제] → BlockMatched.
// 턴은 유지 (NextTurn 없음, SNAKE 는 BlockMatched 로 턴 종료). effects delay 동안 입력 잠금, 턴 시간은 계속 흐름.
message ItemUsed {
  string player_id = 1;         // 사용한 플레이어
  int32 item_id = 2;
  repeated Effect effects = 3;  // 연출 시퀀스 (TRAP_SET 등, trigger ITEM)
  AbilityResult ability = 4;    // 능력 결과 (trigger ITEM, pos 없음, 현재 = trap 사용자 팀만). 셔플 · SNAKE = unset
}

// 게임 최종 결과. 모든 블록 제거 또는 조기 종료 시 전송.
message GameResult {
  repeated TeamResult teams = 1;
  repeated PlayerResult players = 2;
  bool is_draw = 3;
  GameEndReason end_reason = 4;
  int64 ended_at_ms = 5;
}

// 플레이어 퇴장 (포기 or 연결 끊김).
// 상대 플레이어에게 브로드캐스트 후 GameResult 전송.
message PlayerLeft {
  string player_id = 1;
  PlayerLeftReason reason = 2;
}

// 스트림 내 비치명적 에러 알림.
// 연결은 유지되며 클라이언트는 해당 동작만 무시.
// 예) 자기 턴이 아닌데 블록 선택, 유효하지 않은 좌표 등.
message StreamError {
  onet.common.v1.ErrorCode code = 1;
  string message = 2;
}

// 게임 시작 전 취소. RoomJoined 이후 START_GAME 진입 전에만 발생.
// 이 메시지 이후 서버가 스트림을 종료한다.
//
// missing_player_ids: 아직 StartGameReady 를 보내지 못한 실 플레이어 목록 (봇 제외).
//   - READY_TIMEOUT   → 제한 시간 안에 ready 신호를 못 보낸 세션.
//   - PLAYER_DISCONNECTED → 접속 종료로 ready 를 못 보낸 세션 (끊긴 자 포함).
message GameCanceled {
  GameCancelReason reason = 1;
  repeated string missing_player_ids = 2;
}

// ============================================================
// 공통 타입
// ============================================================

message PlayerInfo {
  string player_id = 1;
  string nickname = 2;
  int32 level = 3;
  string team_id = 4;  // 서버가 부여한 팀 식별자. 같은 team_id = 같은 팀.
  bool is_bot = 5;     // 봇 플레이어 여부
  repeated ItemSlot items = 6;  // 입장 아이템 슬롯 (입장 순서, 최대 3, 전원 공개). 사용 갱신 = ItemUsed, 재접속 시 현재값
}

// 입장 아이템 슬롯 1칸. 아이템은 판당 1회 → used 면 소진
message ItemSlot {
  int32 item_id = 1;  // 카탈로그 아이템 id
  bool used = 2;
}

// 보드 전체 상태 스냅샷.
// RoomJoined 및 BoardSyncResponse 에서 사용.
// width/height/seed 는 RoomJoined 에서만 의미있고 BoardSyncResponse 에서는 무시해도 됨.
message BoardState {
  repeated BlockData blocks = 1;         // 현재 남아있는 블록 목록
  repeated SlotData occupied_slots = 2;  // 점유된 슬롯만 포함 (미점유 생략)
  int32 total_block_count = 3;           // 게임 시작 시 전체 블록 수
  int32 remaining_block_count = 4;       // 현재 남은 블록 수
  int32 width = 5;   // 보드 가로 크기
  int32 height = 6;  // 보드 세로 크기
  int64 seed = 7;    // 셔플 동기화용 랜덤 시드
  repeated BlockPos conveyor_cells = 8;  // 컨베이어 벨트 칸 (회전 방향 순서, 마지막 → 첫 칸 순환). 빈 리스트 = 벨트 없음
  repeated BoardObjectData board_objects = 9;  // 보드 오브젝트 (칸 위 물체, 블록 없는 칸에만 존재)
  repeated ActiveItem active_items = 10;       // 판 위에 지속 중인 아이템 효과. 서버가 수신자 팀 기준으로 필터 (상대 팀이 설치한 함정 제외)
}

// 지속 중인 아이템 효과 1개 (스냅샷). 종류 = oneof case, 진행 중 변화는 ItemUsed / 이동 (BoardShuffled · ConveyorShifted moves) / 발동 (BlockMatched) 로 추적
message ActiveItem {
  int32 item_id = 1;          // 사용한 아이템 (카탈로그 id)
  string player_id = 2;       // 사용한 플레이어 (RoomJoined.players 의 team_id 로 본인 / 팀원 구분)
  oneof state {
    BlockPos trap_pos = 3;    // 설치된 함정 칸 (블록과 함께 이동, 매칭되면 사라짐)
  }
}

// 보드 오브젝트 스냅샷 1개. 종류 = oneof case. 보드 오브젝트는 셔플 (BoardShuffled) 대상 아님, 벨트 회전 (ConveyorShifted.moves) 은 칸 내용물로 함께 이동.
message BoardObjectData {
  BlockPos pos = 1;
  oneof state {
    BonusBoxState bonus_box = 2;
  }
}

// 보너스 박스 스냅샷. 종류 (type) 는 스냅샷에만 → 타격 (BoardObjectPassed.bonus_box_remain) 은 pos 로 스냅샷 박스를 찾아 해석. 균열 연출 단계 = remain / total
message BonusBoxState {
  BonusBoxType type = 1;
  int32 total = 2;
  int32 remain = 3;
}

message BlockData {
  BlockPos pos = 1;
  int32 art_num = 2;                            // 블록 그림 식별자. 같은 art_num 끼리 매칭 가능.
  onet.common.v1.AbilityType ability_type = 3;  // 특수블록 능력. 0 = 일반 블록 (숨김 특수블록도 0 → 일반과 구분 불가)
}

// 점유된 슬롯 정보.
message SlotData {
  BlockPos pos = 1;
  string occupied_team_id = 2;
  bool fortified = 3;      // 성벽 특수블록으로 방어된 슬롯. 상대 매칭 경로 / 도둑 강탈로 소유권 안 바뀜
}

// 매칭 경로로 소유가 바뀐 슬롯 1칸 (BlockMatched.occupied). 소유 팀 = BlockMatched.owner_team_id.
// fortified 여부는 여기 없음: 발동 알림 = AbilityResult.fortify, 스냅샷 = SlotData.fortified.
message OccupiedSlot {
  BlockPos pos = 1;
  bool is_retaken = 2;  // 상대팀 슬롯을 역전 점유한 경우 true
}

// 셔플 시 블록 이동 정보.
message BlockMove {
  BlockPos from = 1;
  BlockPos to = 2;
}

// 팀 결과. total_score = tile_count + bonus_score (서버 계산, 승리 판정 기준).
message TeamResult {
  string team_id = 1;
  repeated string player_ids = 2;
  int32 tile_count = 3;     // 게임 종료 시점 보드에서 이 팀이 점령 중인 슬롯 수. 기권/이탈 팀 = -1
  bool is_winner = 4;
  int32 bonus_score = 5;   // 보너스 능력 점수 팀 합계
  int32 total_score = 6;   // 승리 판정 기준 총점 = tile + bonus
}

// 플레이어 개인 결과. total_score = tile_count + bonus_score.
message PlayerResult {
  string player_id = 1;
  string team_id = 2;
  int32 tile_count = 3;    // 게임 중 획득한 슬롯 누적 수 (이후 빼앗긴 슬롯도 차감 안 함). 팀 tile_count 와 다를 수 있음
  int32 matched_count = 4; // 성공 매칭 횟수
  int32 timeout_count = 5; // 타임아웃 횟수
  int32 bonus_score = 6;   // 보너스 능력 점수 개인 누적 (귀속 규칙 = 서버)
  int32 total_score = 7;   // 개인 총점
}

