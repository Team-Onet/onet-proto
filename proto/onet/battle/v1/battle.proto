syntax = "proto3";

package onet.battle.v1;

option csharp_namespace = "Onet.Battle.V1";
option java_multiple_files = true;
option java_outer_classname = "BattleProto";
option java_package = "com.onet.battle.v1";

import "onet/battle/v1/battle_types.proto";
import "onet/common/v1/common_types.proto";
import "onet/common/v1/error_code.proto";

// ============================================================
// 도메인 페이로드 (envelope 와 service 는 battle_base.proto)
// ============================================================

// 룸 입장. battle_token 은 MatchMaker 가 발급한 JWT.
// 페이로드: roomId, playerId, nickname, level
message JoinRoomRequest {
  string battle_token = 1;
}

// 블록 좌표 선택.
// 첫 번째 호출 → 블록 선택, 두 번째 호출 → 매칭 시도.
// 이미 선택한 블록과 같은 좌표 전송 시 → 선택 해제.
message SelectBlockRequest {
  int32 pos_x = 1;
  int32 pos_y = 2;
}

// 아이템 사용 요청. 자신의 턴에서만 유효.
message UseItemRequest {
  onet.common.v1.ItemType item_type = 1;
}

// 보드 전체 상태 동기화 요청.
// 앱 백그라운드 복귀, 재접속 등 상태 불일치 의심 시 사용.
message BoardSyncRequest {}

// 포기 선언. 즉시 패배 처리 후 GameResult 전송.
message GiveUpRequest {}

// 클라이언트 매칭/입장 연출 완료 신호.
// RoomJoined 수신 후 각 클라가 준비되면 송신.
// 서버는 모든 세션(봇 포함)이 ready 상태일 때 GameStarted 를 브로드캐스트한다.
message StartGameReadyRequest {}


// 룸 입장 완료. 초기 보드 상태 포함.
// 모든 플레이어가 받으며, 이후 GameStarted 를 기다린다.
message RoomJoined {
  string room_id = 1;
  repeated PlayerInfo players = 2;
  BoardState board_state = 3;
  onet.common.v1.MatchMode mode = 4;
  string my_player_id = 5;  // 수신자 본인의 playerId
}

// 모든 플레이어 입장 완료 → 게임 시작.
// 이 메시지 이후 첫 번째 NextTurn 이 전송된다.
message GameStarted {
  int64 started_at_ms = 1;                                      // 서버 기준 게임 시작 타임스탬프
  repeated SpecialBlockSummary special_block_summary = 2;       // 이번 게임에 배치된 특수 블록 카탈로그 (종류 + 개수). HIDDEN 포함 - 유저 긴장 UX.
}

// 이번 게임에 활성화된 특수 블록 종류/개수 요약. 실 위치는 BlockData.block_type (visibility 준수) 로 별도 전달.
message SpecialBlockSummary {
  BlockType block_type = 1;
  int32 tile_count = 2;
}

// 다음 턴 시작. 모든 플레이어에게 브로드캐스트.
// turn_end_at_unix_ms: 이번 턴 종료 절대시각 (서버 unix ms). 클라는
// server_time_ms 와 비교해 drift 보정 후 (deadline - now) 로 잔여시간 계산.
// turn_time_ms 는 콤보 보너스가 합산된 최종 총합 (호환성 위해 이름 유지).
// combo_bonus_ms 는 그 중 콤보로 획득한 분량만 별도로 노출 (turn_time_ms 에 이미 포함).
// combo_deadline_unix_ms: 이번 턴 콤보 윈도우 만료 절대시각.
//   - 0 이면 콤보 미적용 (봇 턴 등). 그 외에는 항상 turn_end_at_unix_ms 이하.
//   - 클라는 (combo_deadline - now) 동안 매칭 시 콤보 누적.
// combo_count: 현재 플레이어가 보유한 콤보 카운트. 매칭 직전 값.
message NextTurn {
  string player_id = 1;
  int32 turn_time_ms = 2;       // 이번 턴 총 제한시간 (ms), 팀 콤보 보너스 포함된 합계
  int32 turn_number = 3;        // 전체 턴 카운터 (1부터 시작)
  bool is_prev_timeout = 4;     // 이전 턴이 타임아웃으로 종료된 경우 true
  int64 turn_end_at_unix_ms = 5; // 이번 턴 종료 절대시각 (서버 unix ms)
  int64 combo_deadline_unix_ms = 6; // 콤보 윈도우 만료 절대시각. 개인/팀 판정 통일 사용. 0 = 미적용.
  int32 combo_count = 7;        // 매칭 직전 개인 콤보 카운트 (0 = 콤보 없음)
  int32 combo_bonus_ms = 8;     // turn_time_ms 중 팀 콤보 보너스 분량 (ms). 0 = 보너스 없음/봇
  repeated Effect effects = 9;  // 이 이벤트에서 재생할 연출 시퀀스 (COMBO_BREAK, JOKER_ACTIVATED 등)
  int32 team_combo_count = 10;  // 매칭 직전 팀 콤보 카운트 (0 = 팀 콤보 없음)
  repeated SpecialTurnAbilityType special_turn_abilities = 11;  // 이번 턴 활성 특수 턴 어빌리티. 일반 턴 = 빈 리스트
}

// 블록 선택/해제 브로드캐스트.
// is_deselected = true 이면 선택이 해제된 것.
message BlockSelected {
  string player_id = 1;
  BlockPos pos = 2;
  bool is_deselected = 3;
}

// 매칭 성공 브로드캐스트. 이후 서버가 NextTurn 을 전송한다.
// ability 필드 = 매칭 블록이 특수 블록일 때 발동된 능력. 일반 매칭은 unset (BlockType=NORMAL).
message BlockMatched {
  string player_id = 1;
  BlockPos pos1 = 2;
  BlockPos pos2 = 3;
  repeated BlockPos path = 4;                       // 경로상 모든 좌표 (pos1, pos2 포함)
  repeated OccupiedSlot occupied = 5;               // 이번 매칭으로 점유된 슬롯 목록
  int32 match_score = 6;                            // 획득 점수 (점유 슬롯 합산)
  int32 remaining_block_count = 7;                  // 매칭 후 남은 블록 수
  int32 combo_count = 8;                            // 이 매칭 직후 개인 콤보 카운트 (0 = 봇/자동 매칭)
  bool is_auto_match = 9;                           // true = 서버 자동 매칭 (턴 timeout 트리거). false = 사용자 매칭
  BlockType block_type = 10;                        // 매칭된 블록 종류 (NORMAL / 특수)
  BlockMatchedSpecialAbility ability = 11;          // 특수 블록 매칭 시 발동된 능력 (nullable, 일반 매칭은 unset)
  repeated Effect effects = 12;                     // 이 이벤트에서 재생할 연출 시퀀스 (BLOCK_MATCHED, FEVER, SCORE_BONUS 등)
  int32 team_combo_count = 13;                      // 이 매칭 직후 팀 콤보 카운트 (0 = 자동 매칭/팀 콤보 리셋)
  int32 team_combo_bonus = 14;                      // 팀 콤보 보너스 누적 pt (매칭 직후 시점). 매 매칭 시 실시간 스코어 표시용.
  repeated BlockPos joker_removed_blocks = 15;      // 조커 교차 매칭 (pos1/pos2 artNum 상이) 시 짝 보정으로 추가 제거된 블록 (0 or 2개, 점령 X)
}

// 특수 블록 매칭 시 발동 능력. BlockMatched.ability 필드 타입 (별개 스트림 아님).
// oneof 로 능력별 payload 표현. 연출 재생은 BlockMatched.effects[] 가 담당.
// 셔플 특수 블록은 여기 담기지 않고 BlockMatched 연출 (effects 합) 종료 후 BoardShuffled(reason=SPECIAL_TILE) 로 스트림.
message BlockMatchedSpecialAbility {
  oneof ability {
    ScoreBonusAbility score_bonus = 1;
    TrapAbility trap = 2;
    FortifyAbility fortify = 3;
    ThiefAbility thief = 4;
    // 향후: BombAbility bomb = 5;
  }
}

// 보너스 특수 블록 매칭 결과. 연출 트리거는 BlockMatched.effects[EFFECT_TYPE_SCORE_BONUS].
message ScoreBonusAbility {
  int32 bonus_score = 1;
  int32 total_score = 2;  // drift 검증
}

// 함정 특수 블록 매칭 결과. 매칭한 슬롯이 반대편 팀 소유로 넘어감. 결과는 BlockMatched.occupied 에 이미 반영.
// TODO: 시야 마스킹 (상대에게 안 보임) 별도 이슈 (broadcaster per-recipient).
message TrapAbility {
}

// 성벽 특수 블록 매칭 결과. BlockMatched.occupied 슬롯이 fortified 상태로 마킹 → 도둑 등 뺏기에 저항.
message FortifyAbility {
}

// 도둑 특수 블록 매칭 결과. 상대팀 점유 슬롯을 랜덤 2~6 개 강탈하여 매칭 팀 소유로 이관.
// - 상대 점유 K < N 이면 K 개 전부 강탈 (부족분 무시)
// - 상대 점유 0 이면 미점유 슬롯 N 개 점령 (부족하면 있는 만큼)
// - fortified 슬롯은 강탈 대상에서 제외
// stolen_slots = 이번 발동으로 소유권 이동된 슬롯 (신규 소유자 = 매칭 팀). 클라 강조 애니메이션용.
message ThiefAbility {
  repeated OccupiedSlot stolen_slots = 1;
}

// 매칭 실패 브로드캐스트 (경로 없음 or 타입 불일치).
// 클라이언트는 선택을 초기화하고 재시도 허용.
message BlockMatchFailed {
  string player_id = 1;
  BlockPos pos1 = 2;
  BlockPos pos2 = 3;
}

// 턴 타임아웃. 이후 서버가 NextTurn 을 전송한다.
message TurnTimeout {
  string player_id = 1;
}

// 보드 셔플 완료 브로드캐스트. 셔플 도메인 전용.
// 자동 셔플 / ITEM_TYPE_SHUFFLE / 셔플 특수타일 등 모든 케이스 통합 - reason 으로 소스 구분.
// 새 케이스 추가 시 ShuffleReason enum 만 확장 (message 스키마 stable).
message BoardShuffled {
  repeated BlockMove moves = 1;
  ShuffleReason reason = 2;
  repeated Effect effects = 3;  // 이 이벤트에서 재생할 연출 시퀀스 (BOARD_SHUFFLED)
}

// 보드 전체 상태 동기화 응답.
// turn_end_at_unix_ms: 현재 턴 종료 절대시각 (서버 unix ms).
// 클라는 매 프레임 (deadline - now + drift) 로 잔여시간 계산.
message BoardSyncResponse {
  BoardState board_state = 1;
  string current_player_id = 2;     // 현재 턴 플레이어
  int64 turn_end_at_unix_ms = 3;    // 현재 턴 종료 절대시각 (서버 unix ms)
}

// 아이템 사용 결과 브로드캐스트.
// hint_blocks 는 ITEM_TYPE_FIND 사용자 본인에게만 전송됨.
message ItemUsed {
  string player_id = 1;
  onet.common.v1.ItemType item_type = 2;
  repeated BlockPos hint_blocks = 3;  // ITEM_TYPE_FIND: [pos1, pos2] 힌트 쌍
  repeated Effect effects = 4;        // 이 이벤트에서 재생할 연출 시퀀스
}

// 게임 최종 결과. 모든 블록 제거 또는 조기 종료 시 전송.
message GameResult {
  repeated TeamResult teams = 1;
  repeated PlayerResult players = 2;
  bool is_draw = 3;
  GameEndReason end_reason = 4;
  int64 ended_at_ms = 5;
}

// 플레이어 퇴장 (포기 or 연결 끊김).
// 상대 플레이어에게 브로드캐스트 후 GameResult 전송.
message PlayerLeft {
  string player_id = 1;
  PlayerLeftReason reason = 2;
}

// 스트림 내 비치명적 에러 알림.
// 연결은 유지되며 클라이언트는 해당 동작만 무시.
// 예) 자기 턴이 아닌데 블록 선택, 유효하지 않은 좌표 등.
message StreamError {
  onet.common.v1.ErrorCode code = 1;
  string message = 2;
}

// 게임 시작 전 취소. RoomJoined 이후 START_GAME 진입 전에만 발생.
// 이 메시지 이후 서버가 스트림을 종료한다.
//
// missing_player_ids: 아직 StartGameReady 를 보내지 못한 실 플레이어 목록 (봇 제외).
//   - READY_TIMEOUT   → 제한 시간 안에 ready 신호를 못 보낸 세션.
//   - PLAYER_DISCONNECTED → 접속 종료로 ready 를 못 보낸 세션 (끊긴 자 포함).
message GameCanceled {
  GameCancelReason reason = 1;
  repeated string missing_player_ids = 2;
}

// ============================================================
// 공통 타입
// ============================================================

message BlockPos {
  int32 x = 1;
  int32 y = 2;
}

message PlayerInfo {
  string player_id = 1;
  string nickname = 2;
  int32 level = 3;
  string team_id = 4;  // 서버가 부여한 팀 식별자. 같은 team_id = 같은 팀.
  bool is_bot = 5;     // 봇 플레이어 여부
}

// 보드 전체 상태 스냅샷.
// RoomJoined 및 BoardSyncResponse 에서 사용.
// width/height/seed/map_id 는 RoomJoined 에서만 의미있고 BoardSyncResponse 에서는 무시해도 됨.
message BoardState {
  repeated BlockData blocks = 1;         // 현재 남아있는 블록 목록
  repeated SlotData occupied_slots = 2;  // 점유된 슬롯만 포함 (미점유 생략)
  int32 total_block_count = 3;           // 게임 시작 시 전체 블록 수
  int32 remaining_block_count = 4;       // 현재 남은 블록 수
  int32 width = 5;   // 보드 가로 크기
  int32 height = 6;  // 보드 세로 크기
  int64 seed = 7;    // 셔플 동기화용 랜덤 시드
}

message BlockData {
  BlockPos pos = 1;
  int32 art_num = 2;         // 블록 종류 식별자. 같은 art_num 끼리 매칭 가능.
  BlockType block_type = 3;  // 블록 종류 (NORMAL / 특수). UNSPECIFIED = 히든 특수 블록 (서버가 마스킹).
}

// 점유된 슬롯 정보.
message SlotData {
  BlockPos pos = 1;
  string occupied_player_id = 2;
  string occupied_team_id = 3;
  bool fortified = 4;      // 성벽 특수타일 매칭으로 방어된 슬롯 - 상대 점령 저항 (도둑 등 향후 특수효과 대상)
  bool trap_captured = 5;  // 함정 특수타일 매칭으로 획득한 슬롯 - 클라 시각 강조용 (표시 여부는 클라 판단)
}

// 매칭 성공 시 점유된 슬롯 상세 정보.
// 성벽 fortified 마킹 알림 = BlockMatched.ability.fortify 필드로 담김 (여기 필드 X).
// 재접속/스냅샷 복원용 fortified 상태 = SlotData.fortified 로 별도 전달.
message OccupiedSlot {
  BlockPos pos = 1;
  string player_id = 2;
  string team_id = 3;
  bool is_retaken = 4;  // 상대팀 슬롯을 역전 점유한 경우 true
}

// 셔플 시 블록 이동 정보.
message BlockMove {
  BlockPos from = 1;
  BlockPos to = 2;
}

// 팀 결과. total_score = tile_count + bonus_score + combo_bonus (서버 계산, 승리 판정 기준).
message TeamResult {
  string team_id = 1;
  repeated string player_ids = 2;
  int32 tile_count = 3;
  bool is_winner = 4;
  int32 bonus_score = 5;   // 보너스 특수타일 팀 합계
  int32 combo_bonus = 6;   // 팀 콤보 보너스 (팀 트랙 3콤보 이상 매칭 시 +1 누적)
  int32 total_score = 7;   // 승리 판정 기준 총점 = tile + bonus + team combo bonus
  int32 max_combo = 8;     // 이 팀이 이번 게임에 도달한 최고 팀 콤보
}

// 플레이어 개인 결과. total_score = tile_count + bonus_score + combo_bonus.
message PlayerResult {
  string player_id = 1;
  string team_id = 2;
  int32 tile_count = 3;    // 점유한 슬롯 수
  int32 matched_count = 4; // 성공 매칭 횟수
  int32 timeout_count = 5; // 타임아웃 횟수
  int32 max_combo = 6;     // 게임 중 도달한 최고 콤보
  int32 bonus_score = 7;   // 보너스 특수타일 개인 누적
  int32 combo_bonus = 8;   // 콤보 보너스 개인 누적 (3콤보 이상 매칭 시 +1)
  int32 total_score = 9;   // 개인 총점
}

