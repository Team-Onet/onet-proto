syntax = "proto3";

package onet.battle.v1;

option csharp_namespace = "Onet.Battle.V1";
option java_multiple_files = true;
option java_outer_classname = "BattleTypesProto";
option java_package = "com.onet.battle.v1";

enum GameEndReason {
  GAME_END_REASON_UNSPECIFIED = 0;
  GAME_END_REASON_ALL_BLOCKS_CLEARED = 1;  // 모든 블록 제거로 정상 종료
  GAME_END_REASON_GIVE_UP = 2;             // 플레이어 포기
  GAME_END_REASON_PLAYER_LEFT = 3;         // 플레이어 연결 끊김
  GAME_END_REASON_TURN_LIMIT_EXCEEDED = 4; // 확보. 현재 서버에서 발동 X (턴 카운트 기반 자동 종료 정책 재도입 시 사용)
  GAME_END_REASON_ABORTED = 5;             // 시스템 오류로 강제 종료 (셔플 불가 등)
  GAME_END_REASON_AFK_FORFEIT = 6;         // 연속 미조작으로 자동 기권 처리
  GAME_END_REASON_GAME_TIME_EXCEEDED = 7;  // 게임 시작 후 최대 시간 (스펙 ModeSpec.afk.hard_timeout_ms) 초과로 자동 종료
}

enum PlayerLeftReason {
  PLAYER_LEFT_REASON_UNSPECIFIED = 0;
  PLAYER_LEFT_REASON_GIVE_UP = 1;
  PLAYER_LEFT_REASON_DISCONNECTED = 2;
  PLAYER_LEFT_REASON_AFK_FORFEIT = 3;   // 연속 미조작으로 자동 기권 처리
}

enum GameCancelReason {
  GAME_CANCEL_REASON_UNSPECIFIED = 0;
  GAME_CANCEL_REASON_READY_TIMEOUT = 1;         // RoomJoined 후 제한 시간 내 StartGameReady 미수신
  GAME_CANCEL_REASON_PLAYER_DISCONNECTED = 2;   // READY_WAIT 중 플레이어 접속 종료
}

// 시각/사운드 효과 1개. 각 이벤트 message 안 `repeated Effect effects` 필드에 entry 로 실림.
// 클라는 시퀀스 순서대로 재생. 서버는 delay_ms 합계만큼 대기 후 다음 액션 발행 (동기화).
message Effect {
  EffectType type = 1;
  int64 delay_ms = 2;
  // 발동원. 능력 · 발동원 연출 (BONUS, BOMB, BONUS_BOX_BROKEN, TRAP_SET, JOKER_ACTIVATED 등) = 세팅 → 같은 trigger 의 AbilityResult 가 payload.
  // 발동원 없는 연출 (BLOCK_MATCHED, FEVER, BOARD_SHUFFLED 등) = unset. 예외: SNAKE 아이템 매칭의 BLOCK_MATCHED = ITEM (pos 없음)
  EffectTrigger trigger = 3;
}

// 발동원 = 능력 · 연출을 일으킨 콘텐츠 + 칸. 연출 (Effect.trigger) ↔ 결과 (AbilityResult.trigger) 매칭 키 + 연출 원점
message EffectTrigger {
  EffectTriggerType type = 1;
  BlockPos pos = 2;  // 발동원 칸 = 연출 원점. 칸 없는 발동원 (아이템 사용 · 캐치업) = unset
}

// 발동원 종류. 새 발동원은 값 추가 (데이터가 pos 로 부족하면 EffectTrigger 필드 확장 검토)
enum EffectTriggerType {
  EFFECT_TRIGGER_TYPE_UNSPECIFIED = 0;
  EFFECT_TRIGGER_TYPE_SPECIAL_BLOCK = 1;  // 매칭한 특수블록 (pos = 블록 칸) → BlockMatched.abilities
  EFFECT_TRIGGER_TYPE_BONUS_BOX = 2;      // 보너스 상자 파괴 보상 (pos = 상자 칸) → BlockMatched.abilities. BONUS_BOX_BROKEN 도 같은 trigger
  EFFECT_TRIGGER_TYPE_ITEM = 3;           // 아이템. 사용 (pos 없음) → ItemUsed.ability / SNAKE 매칭 BLOCK_MATCHED (pos 없음) / 설치 함정 발동 TRAP_SPRUNG (pos = 함정 칸, 매칭 블록 둘 다 함정이면 칸별 1개)
  EFFECT_TRIGGER_TYPE_CATCH_UP = 4;       // 캐치업 밸런스 지급 (pos 없음) → NextTurn.turn_abilities, 개시 연출 JOKER_ACTIVATED
}

message BlockPos {
  int32 x = 1;
  int32 y = 2;
}

// 클라 연출 재생 트리거. 매칭/셔플/턴 등 각 이벤트 message 안 repeated Effect 필드에 담겨 전달.
// 능력 연출 이름 = 능력 이름 (AbilityType).
enum EffectType {
  EFFECT_TYPE_UNSPECIFIED = 0;
  EFFECT_TYPE_BLOCK_MATCHED = 1;     // 매칭 성공 점령 연출
  EFFECT_TYPE_FEVER = 2;             // 피버 진입 (남은 블록 50% 이하 최초 도달 시 1회)
  EFFECT_TYPE_BOARD_SHUFFLED = 3;    // 셔플 연출 (BoardShuffled.effects, reason 무관)
  EFFECT_TYPE_BONUS = 4;             // 보너스 능력 +N 팝업 연출
  EFFECT_TYPE_TRAP_SPRUNG = 5;       // 설치 함정 (아이템) 블록 매칭 → 반대편 팀 소유로 반전 연출 (trigger ITEM)
  EFFECT_TYPE_FORTIFY = 6;           // 성벽 능력 → 이번 매칭 점령 슬롯 fortified 형성 연출
  EFFECT_TYPE_THIEF = 7;             // 도둑 능력 → 슬롯 강탈 / 점령 연출
  EFFECT_TYPE_JOKER_ACTIVATED = 8;   // 조커 턴 개시 연출 (NextTurn.effects)
  EFFECT_TYPE_JOKER_MATCHED = 9;     // 조커 교차 매칭 → 짝 보정 블록 제거 연출 (BlockMatched.effects)
  EFFECT_TYPE_BOMB = 10;             // 폭탄 능력 → 추가 블록 쌍 폭파 + 점령 연출 (BlockMatched.effects, bomb.slots 비면 생략)
  EFFECT_TYPE_CONVEYOR_SHIFTED = 11; // 컨베이어 벨트 1칸 회전 연출 (ConveyorShifted.effects)
  EFFECT_TYPE_BONUS_BOX_BROKEN = 12; // 보너스 박스 파괴 연출 (BlockMatched.effects, 박스 종류 공통). 보상 연출은 뒤이어 별도 effect
  EFFECT_TYPE_TRAP_SET = 13;         // 함정 아이템 설치 연출 (ItemUsed.effects). 상대 팀은 위치 없이 사용 사실만 연출
  EFFECT_TYPE_ERASER = 14;           // 지우개 블록 제거 연출 (ItemUsed.effects, trigger ITEM). 대상 = ItemUsed.ability.eraser
  EFFECT_TYPE_HOOK = 15;             // 후크의 갈고리 강탈 연출 (ItemUsed.effects, trigger ITEM). 대상 = ItemUsed.ability.hook
  EFFECT_TYPE_INK = 16;              // 먹물 뿌리기 연출 (ItemUsed.effects, trigger ITEM). 대상 = ItemUsed.ability.ink
  // 향후: MILESTONE, STREAK 등
}

// 셔플 원인. `BoardShuffled.reason`. 능력 셔플은 발동원 무관 ABILITY 1개 (발동원 = AbilityResult.trigger)
enum ShuffleReason {
  SHUFFLE_REASON_UNSPECIFIED = 0;
  SHUFFLE_REASON_NO_MOVES = 1;       // 매칭 가능 pair 없음 (교착 · 2연속 타임아웃) → 서버 자동 셔플
  SHUFFLE_REASON_ABILITY = 2;        // 셔플 능력 발동. 발동원 = 직전 메시지 AbilityResult.shuffle 의 trigger
}

// 보너스 박스 종류 (BonusBoxState.type). 동작 (경로 통과마다 HP -1, 0 이면 파괴 + 막타 점령자 보상) 은 공통, 종류별로 보상 / 외형만 다름
enum BonusBoxType {
  BONUS_BOX_TYPE_UNSPECIFIED = 0;
  BONUS_BOX_TYPE_NORMAL = 1;  // 일반 박스. 보상 = 블록 능력 1개 랜덤 (SHUFFLE 제외, BlockMatched.abilities trigger BONUS_BOX)
}
