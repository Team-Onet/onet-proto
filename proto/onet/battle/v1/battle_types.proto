syntax = "proto3";

package onet.battle.v1;

option csharp_namespace = "Onet.Battle.V1";
option java_multiple_files = true;
option java_outer_classname = "BattleTypesProto";
option java_package = "com.onet.battle.v1";

enum GameEndReason {
  GAME_END_REASON_UNSPECIFIED = 0;
  GAME_END_REASON_ALL_BLOCKS_CLEARED = 1;  // 모든 블록 제거로 정상 종료
  GAME_END_REASON_GIVE_UP = 2;             // 플레이어 포기
  GAME_END_REASON_PLAYER_LEFT = 3;         // 플레이어 연결 끊김
  GAME_END_REASON_TURN_LIMIT_EXCEEDED = 4; // 확보. 현재 서버에서 발동 X (턴 카운트 기반 자동 종료 정책 재도입 시 사용)
  GAME_END_REASON_ABORTED = 5;             // 시스템 오류로 강제 종료 (셔플 불가 등)
  GAME_END_REASON_AFK_FORFEIT = 6;         // 연속 미조작으로 자동 기권 처리
  GAME_END_REASON_GAME_TIME_EXCEEDED = 7;  // 게임 시작 후 최대 시간 (AfkPolicy.hardTimeoutSec) 초과로 자동 종료
}

enum PlayerLeftReason {
  PLAYER_LEFT_REASON_UNSPECIFIED = 0;
  PLAYER_LEFT_REASON_GIVE_UP = 1;
  PLAYER_LEFT_REASON_DISCONNECTED = 2;
  PLAYER_LEFT_REASON_AFK_FORFEIT = 3;   // 연속 미조작으로 자동 기권 처리
}

enum GameCancelReason {
  GAME_CANCEL_REASON_UNSPECIFIED = 0;
  GAME_CANCEL_REASON_READY_TIMEOUT = 1;         // RoomJoined 후 제한 시간 내 StartGameReady 미수신
  GAME_CANCEL_REASON_PLAYER_DISCONNECTED = 2;   // READY_WAIT 중 플레이어 접속 종료
}

// 시각/사운드 효과 1개. 각 이벤트 message 안 `repeated Effect effects` 필드에 entry 로 실림.
// 클라는 시퀀스 순서대로 재생. 서버는 delay_ms 합계만큼 대기 후 다음 액션 발행 (동기화).
message Effect {
  EffectType type = 1;
  int64 delay_ms = 2;
}

// 클라 연출 재생 트리거. 매칭/셔플/턴 등 각 이벤트 message 안 repeated Effect 필드에 담겨 전달.
// 블록 정체성 (BlockType) 과 무관.
enum EffectType {
  EFFECT_TYPE_UNSPECIFIED = 0;
  EFFECT_TYPE_BLOCK_MATCHED = 1;     // 매칭 성공 점령 연출
  EFFECT_TYPE_FEVER = 2;             // 피버 진입 (남은 블록 50% 이하 최초 도달 시 1회)
  EFFECT_TYPE_BOARD_SHUFFLED = 3;    // 셔플 연출 (BoardShuffled.effects, reason 무관)
  EFFECT_TYPE_COMBO_BREAK = 4;       // 콤보 윈도우 만료/턴 타임아웃 등으로 콤보 끊김
  EFFECT_TYPE_SCORE_BONUS = 5;       // 보너스 특수 블록 매칭 시 +N 팝업 연출
  EFFECT_TYPE_TRAP_SPRUNG = 6;       // 함정 특수 블록 매칭 → 반대편 팀 소유로 반전 연출
  EFFECT_TYPE_FORTIFY = 7;           // 성벽 특수 블록 매칭 → 획득 슬롯 fortified 형성 연출
  EFFECT_TYPE_STEAL = 8;             // 도둑 특수 블록 매칭 → 상대 슬롯 강탈 연출
  EFFECT_TYPE_JOKER_ACTIVATED = 9;   // 조커 특수 턴 개시 연출 (NextTurn.effects)
  EFFECT_TYPE_JOKER_MATCHED = 10;    // 조커 교차 매칭 → 짝 보정 블록 제거 연출 (BlockMatched.effects)
  EFFECT_TYPE_BOMB = 11;             // 폭탄 특수블록 → 추가 블록 쌍 폭파 + 점령 연출 (BlockMatched.effects, bombed_slots 비면 생략)
  // 향후: COMBO, MILESTONE, STREAK, ITEM_* 등
}

// 블록 정체성 (BlockData.block_type, SpecialBlockSummary.block_type, BlockMatched.block_type).
// NORMAL = 일반 블록. 나머지 = 특수 블록. 새 특수 블록 추가 시 이 enum 확장.
enum BlockType {
  UNSPECIFIED = 0;  // BlockData 에서는 HIDDEN 특수블록 마스킹 (일반 블록처럼 표시)
  NORMAL   = 1;  // 일반 블록
  BONUS    = 2;  // 보너스 특수 블록 (매칭 시 +N 점수)
  SHUFFLE  = 3;  // 셔플 특수 블록 (매칭 시 남은 블록 재배치)
  TRAP     = 4;  // 함정 특수 블록 (매칭 시 상대에게 슬롯 이전)
  FORTIFY  = 5;  // 성벽 특수 블록 (매칭 시 슬롯 fortified 마킹)
  THIEF    = 6;  // 도둑 특수 블록 (매칭 시 상대팀 점유 슬롯 랜덤 min~max값 개 강탈, 성벽 slot skip)
  BOMB     = 7;  // 폭탄 특수 블록 (매칭 시 랜덤 min~max값 블록 쌍 추가 제거 + 그 칸 점령)
  // 향후: WALL 등
}

// 특수 턴 어빌리티. NextTurn.special_turn_abilities 에 실려 해당 턴 한정 규칙 변경을 알린다. 복수 동시 적용 가능.
enum SpecialTurnAbilityType {
  SPECIAL_TURN_ABILITY_TYPE_UNSPECIFIED = 0;
  SPECIAL_TURN_ABILITY_TYPE_JOKER = 1;  // 이번 턴 모든 블록 상호 매칭 가능. 첫 매칭 성공 시 해제
}

// 셔플 트리거 유형. `BoardShuffled.reason` 에 실려 클라가 셔플 원인을 인지한다.
// 셔플 발생 소스가 늘어나도 이 enum 만 확장 (BoardShuffled 자체는 stable).
enum ShuffleReason {
  SHUFFLE_REASON_UNSPECIFIED = 0;
  SHUFFLE_REASON_NO_MOVES = 1;       // 매칭 가능 pair 없음 → 서버 자동 셔플
  SHUFFLE_REASON_ITEM = 2;           // ITEM_TYPE_SHUFFLE 아이템 사용
  SHUFFLE_REASON_SPECIAL_TILE = 3;   // 셔플 특수타일 매칭 발동
}
